services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coach_command_room
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach_dev
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach -d coach_command_room"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://coach:coach_dev@db:5432/coach_command_room
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-in-production
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    volumes: [./backend:/app]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
